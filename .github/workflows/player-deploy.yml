name: Deploy Player

on:
  push:
    branches:
      - work

permissions:
  contents: read

concurrency:
  group: atlas-player-production
  cancel-in-progress: false

env:
  SOURCE_REVISION: ${{ github.sha }}
  SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}

jobs:
  deploy-player:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - name: Checkout exact push revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify fork beta channel
        run: node scripts/release-channel.js --branch work

      - name: Typecheck plugin
        run: npx tsc --noEmit

      - name: Typecheck player
        run: npm run typecheck:player

      - name: Typecheck relay
        run: npm run typecheck:relay

      - name: Check dependency boundaries
        run: npm run check:boundaries

      - name: Test player state, transport and fake table
        run: npm run test:player -- --exclude player/tests/conformance.test.ts

      - name: Test relay in Workers runtime
        run: npm run test:relay

      - name: Test plugin, protocol and GM agency
        run: npx vitest run --project unit

      - name: Build player with corresponding source link
        run: npm run build:player

      - name: Test real local relay conformance
        run: npx vitest run --project player player/tests/conformance.test.ts

      - name: Record required workstation privacy acceptance
        run: |
          printf '%s\n' 'Required before feature acceptance: run npm run test:player:browser and the targeted GPU privacy suites on a GPU-equipped workstation. Hosted CPU checks do not verify rendering or observed browser smoke.' >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare relay host secret
        env:
          HOST_KEY: ${{ secrets.HOST_KEY }}
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import { join } from "node:path";
            if (!process.env.HOST_KEY) throw new Error("HOST_KEY is not configured");
            writeFileSync(join(process.env.RUNNER_TEMP, "atlas-player-secrets.json"), JSON.stringify({ HOST_KEY: process.env.HOST_KEY }), { mode: 0o600, flag: "wx" });
          '

      - name: Deploy static player and relay together
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .
          wranglerVersion: '4.151.1'
          command: deploy --config relay/wrangler.jsonc --secrets-file "${{ runner.temp }}/atlas-player-secrets.json"

      - name: Remove temporary relay secret
        if: always()
        run: rm -f "$RUNNER_TEMP/atlas-player-secrets.json"
